<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WhatsApp Bulk Sender</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
  body {
    font-family: Arial;
    max-width: 500px;
    margin: 40px auto;
    padding: 20px;
    text-align: center;
  }

  textarea, input, button {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    font-size: 16px;
  }

  button {
    background: #25D366;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }

  button:hover {
    background: #1da851;
  }

  .hint {
    font-size: 12px;
    color: gray;
  }
</style>
</head>

<body>

<h2>WhatsApp Bulk Sender</h2>

<textarea id="numbers" rows="6" placeholder="Enter numbers (one per line)
Example:
919876543210
918888888888"></textarea>

<textarea id="message" rows="5" placeholder="Enter message"></textarea>

<input id="delay" type="number" placeholder="Delay in seconds (e.g. 5)" value="3"/>

<button onclick="sendBulk()">Start Bulk Send</button>

<p class="hint">Opens each chat one-by-one in WhatsApp Web</p>

<script>
function cleanPhone(phone) {
  return phone.replace(/\D/g, "");
}

function openWhatsApp(phone, message) {
  const encoded = encodeURIComponent(message);
  const url = `https://web.whatsapp.com/send?phone=${phone}&text=${encoded}`;
  window.open(url, "_blank");
}

async function sendBulk() {
  let numbers = document.getElementById("numbers").value.trim().split("\n");
  let message = document.getElementById("message").value.trim();
  let delay = parseInt(document.getElementById("delay").value) || 3;

  if (!numbers.length || !message) {
    alert("Enter numbers and message");
    return;
  }

  for (let i = 0; i < numbers.length; i++) {
    let phone = cleanPhone(numbers[i]);

    if (phone.length < 10) continue;

    openWhatsApp(phone, message);

    await new Promise(r => setTimeout(r, delay * 1000));
  }

  alert("Bulk process started. Check WhatsApp tabs.");
}
</script>

</body>
</html>
